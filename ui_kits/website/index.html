<!doctype html>
<!-- @dsCard group="UI Kit — Website" name="Ella Website UI Kit" subtitle="Interactive prototype · Home, Quiz, Article, Supplements, Doctor checklist · Tweaks panel" viewport="1280x900" -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="style.css" />
  <!-- Extra display & alt fonts so the Tweaks panel can swap them live -->

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#fbf8f4"/>
      <g transform="translate(38, 22)" fill="none" stroke="#c87f6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 50 Q12 28 12 6"/>
        <path d="M12 38 Q2 34 -4 24"/>
        <path d="M12 32 Q22 28 28 18"/>
        <path d="M12 24 Q6 20 2 12"/>
        <path d="M12 18 Q18 14 22 6"/>
        <circle cx="12" cy="6" r="2.4" fill="#c87f6e"/>
      </g>
      <text x="50" y="86" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#2f261d">ella</text>
    </svg>
  </template>
  <div id="root"></div>

  <!-- Module loader: fetches each file, transforms JSX + any `export` syntax via
       Babel's CommonJS plugin, runs it, and mirrors its exports onto window. This
       lets component files use `export function Name(...)` (for the design-system
       compiler) while still working as plain globals in this live prototype. -->
  <script>
  (function () {
    async function loadModule(src) {
      const res = await fetch(src);
      const code = await res.text();
      const out = Babel.transform(code, {
        presets: ['react'],
        plugins: ['transform-modules-commonjs'],
        filename: src,
        sourceType: 'unambiguous',
      }).code;
      const module = { exports: {} };
      const fn = new Function('exports', 'module', 'React', 'ReactDOM',
        out + '\n//# sourceURL=' + location.origin + '/' + src);
      fn(module.exports, module, window.React, window.ReactDOM);
      Object.assign(window, module.exports);
    }
    async function boot() {
      const files = [
        'tweaks-panel.jsx',
        'components/i18n.jsx',
        'components/Icons.jsx',
        'components/SvgAssets.jsx',
        'components/Photo.jsx',
        'components/PromoBar.jsx',
        'components/FeaturedIn.jsx',
        'components/Testimonials.jsx',
        'components/CommunityBanner.jsx',
        'components/InfoLinks.jsx',
        'components/Header.jsx',
        'components/Footer.jsx',
        'screens/articleData.jsx',
        'screens/Homepage.jsx',
        'screens/AboutJessica.jsx',
        'screens/AwarenessQuiz.jsx',
        'screens/ArticleView.jsx',
        'screens/ArticlesHub.jsx',
        'screens/NutritionHub.jsx',
        'screens/HormonalTherapy.jsx',
        'screens/ReproductiveHealth.jsx',
        'screens/AskYourDoctor.jsx',
        'screens/SupplementsHub.jsx',
        'app.jsx',
      ];
      for (const f of files) await loadModule(f);
    }
    boot();
  })();
  </script>
</body>
</html>
