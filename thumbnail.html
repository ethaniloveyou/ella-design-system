<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1280px;height:854px;display:flex;font-family:'DM Serif Display',Georgia,serif}
  .main{flex:1;background:var(--ella-rose,#c87f6e);display:flex;align-items:center;justify-content:center}

  .swatches{width:320px;height:854px;display:flex;flex-direction:column}

</head><body>
  <div class="main"><span>ella</span></div>
  <div class="swatches">
    <div style="background:var(--ella-sand-100,#efe7da)"></div>
    <div style="background:var(--ella-rose,#c87f6e)"></div>
    <div style="background:var(--ella-plum-500,#7e5266)"></div>
    <div style="background:var(--ella-clay-900,#2f261d)"></div>
  </div>
</body></html>
