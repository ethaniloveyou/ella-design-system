<!doctype html>
<!-- @dsCard group="Brand" name="Components — Newsletter Signup" subtitle="Hero / footer block" viewport="700x180" -->
<html><head><meta charset="utf-8"><title>Newsletter signup</title><link rel="stylesheet" href="_card.css"></head>
<body>
  <div style="background: var(--ella-blush-50); border-radius: 24px; padding: 28px 32px; display: flex; gap: 24px; align-items: center; flex-wrap: wrap;">
    <div style="flex: 1; min-width: 260px;">
      <div style="font-family: var(--font-display); font-size: 30px; line-height: 1.15; color: var(--ella-clay-900);">Get the weekly note.</div>
      <div style="font-size: 15px; color: var(--ella-clay-700); margin-top: 4px;">Honest, useful, never spammy.</div>
    </div>
    <form style="display: flex; gap: 8px; flex: 1; min-width: 280px;">
      <input type="email" placeholder="you@example.com" style="flex: 1; font-family: var(--font-body); font-size: 16px; padding: 14px 16px; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--ella-white);">
      <button type="submit" style="background: var(--ella-rose); color: var(--ella-cream-50); border: 0; padding: 14px 22px; border-radius: 12px; font-family: var(--font-body); font-weight: 600; font-size: 16px; cursor: pointer;">Subscribe</button>
    </form>
  </div>
</body></html>
