<!doctype html>
<!-- @dsCard group="Brand" name="Brand — Illustrations" subtitle="Botanical & celestial line motifs" viewport="700x220" -->
<html><head><meta charset="utf-8"><title>Brand illustrations</title><link rel="stylesheet" href="_card.css"></head>
<body>
  <div style="display: flex; gap: 24px; align-items: flex-end; color: var(--ella-rose);">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <img src="../assets/illustration-sprig.svg" width="80" style="color: var(--ella-rose);">
      <div class="swatch-token" style="color: var(--fg-secondary);">sprig</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--ella-sage-500);">
      <img src="../assets/illustration-branch.svg" width="110">
      <div class="swatch-token" style="color: var(--fg-secondary);">branch</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--ella-rose);">
      <img src="../assets/illustration-sun.svg" width="80">
      <div class="swatch-token" style="color: var(--fg-secondary);">sun</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--ella-plum-500);">
      <img src="../assets/illustration-half-moon.svg" width="80">
      <div class="swatch-token" style="color: var(--fg-secondary);">half-moon</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--ella-rose-300); flex: 1; min-width: 0;">
      <img src="../assets/illustration-wave.svg" width="200" style="width: 100%; max-width: 240px;">
      <div class="swatch-token" style="color: var(--fg-secondary);">wave divider</div>
    </div>
  </div>
  <div style="margin-top:14px; font-size:13px; color: var(--fg-muted); font-style: italic;">1.5px stroke line art. Inherit color via <code>currentColor</code> — pair sage with nutrition, plum with sleep/hormones, rose for accent.</div>
</body></html>
