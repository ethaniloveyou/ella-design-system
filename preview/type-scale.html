<!doctype html>
<!-- @dsCard group="Brand" name="Type — Scale" subtitle="Full ramp xs → 7xl" viewport="700x340" -->
<html><head><meta charset="utf-8"><title>Type scale</title><link rel="stylesheet" href="_card.css"></head>
<body>
  <div style="display:grid; grid-template-columns: 60px 1fr 100px; gap: 6px 16px; align-items: baseline; font-family: var(--font-body); color: var(--fg-secondary);">
    <div class="swatch-token">7xl</div><div style="font-family: var(--font-display); font-size: 60px; line-height: 1;">Aa</div><div class="swatch-token">96 / display</div>
    <div class="swatch-token">5xl</div><div style="font-family: var(--font-display); font-size: 48px; line-height: 1;">Aa</div><div class="swatch-token">60 / display</div>
    <div class="swatch-token">3xl</div><div style="font-family: var(--font-display); font-size: 36px; line-height: 1;">Aa</div><div class="swatch-token">38 / display</div>
    <div class="swatch-token">2xl</div><div style="font-weight: 600; font-size: 28px; line-height: 1;">Aa</div><div class="swatch-token">30 / body</div>
    <div class="swatch-token">xl</div><div style="font-weight: 600; font-size: 22px; line-height: 1;">Aa</div><div class="swatch-token">24 / body</div>
    <div class="swatch-token">md</div><div style="font-size: 18px; line-height: 1;">Aa</div><div class="swatch-token">18 / body</div>
    <div class="swatch-token">sm</div><div style="font-size: 16px; line-height: 1;">Aa</div><div class="swatch-token">16 / body</div>
    <div class="swatch-token">xs</div><div style="font-size: 14px; line-height: 1;">Aa</div><div class="swatch-token">14 / body</div>
  </div>
</body></html>
