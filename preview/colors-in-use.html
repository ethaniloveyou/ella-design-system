<!doctype html>
<!-- @dsCard group="Brand" name="Colors — In Use" subtitle="How the palette composes in a card" viewport="700x190" -->
<html><head><meta charset="utf-8"><title>Color in use</title><link rel="stylesheet" href="_card.css"></head>
<body>
  <div style="background: var(--ella-cream-50); padding: 24px; border-radius: 16px; border: 1px solid var(--border-default); display: flex; gap: 20px; align-items: center;">
    <div style="flex: 1;">
      <div class="ella-eyebrow">PERIMENOPAUSE</div>
      <div style="font-family: var(--font-display); font-size: 30px; line-height: 1.15; color: var(--ella-clay-900); margin-top: 6px;">Hot flashes waking you up?</div>
      <div style="font-size: 15px; color: var(--ella-clay-700); margin-top: 6px;">You're not imagining it — here's what's actually happening.</div>
    </div>
    <button style="background: var(--ella-rose); color: var(--ella-cream-50); border: 0; padding: 14px 22px; border-radius: 12px; font-family: var(--font-body); font-weight: 600; font-size: 16px; cursor: pointer;">Learn more</button>
  </div>
  <div style="margin-top:14px; font-size:13px; color: var(--fg-muted); font-style: italic;">Cream canvas, sand border, rose-deep eyebrow, clay-900 headline, rose CTA. ~70% neutral, color used as accent only.</div>
</body></html>
