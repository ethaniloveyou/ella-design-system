<!doctype html>
<!-- @dsCard group="Brand" name="Spacing — Shadows" subtitle="Soft warm-tinted elevation" viewport="700x190" -->
<html><head><meta charset="utf-8"><title>Shadows</title><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card-row" style="gap: 36px;">
    <div class="swatch"><div style="width: 160px; height: 96px; background: #fff; border-radius: 12px;"></div><div class="swatch-label">none</div><div class="swatch-token">flat surfaces</div></div>
    <div class="swatch"><div style="width: 160px; height: 96px; background: #fff; border-radius: 12px; box-shadow: 0 1px 2px rgba(74,47,40,.04), 0 2px 8px rgba(74,47,40,.06);"></div><div class="swatch-label">soft</div><div class="swatch-token">resting cards</div></div>
    <div class="swatch"><div style="width: 160px; height: 96px; background: #fff; border-radius: 12px; box-shadow: 0 4px 12px rgba(74,47,40,.08), 0 12px 32px rgba(74,47,40,.10);"></div><div class="swatch-label">lifted</div><div class="swatch-token">hover · modal</div></div>
    <div class="swatch"><div style="width: 160px; height: 96px; background: #fff; border-radius: 12px; box-shadow: 0 16px 48px rgba(74,47,40,.18), 0 4px 12px rgba(74,47,40,.08);"></div><div class="swatch-label">modal</div><div class="swatch-token">overlays</div></div>
  </div>
  <div style="margin-top:14px; font-size:13px; color: var(--fg-muted); font-style: italic;">Always warm-tinted (clay-900 base, not pure black). Low spread, never harsh.</div>
</body></html>
