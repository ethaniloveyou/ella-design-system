<!doctype html>
<!-- @dsCard group="Brand" name="Components — Inputs" subtitle="Text · select · helper" viewport="700x160" -->
<html><head><meta charset="utf-8"><title>Form inputs</title><link rel="stylesheet" href="_card.css">
<style>
  .field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 200px; }
  label { font-family: var(--font-body); font-size: 14px; font-weight: 600; color: var(--ella-clay-700); }
  input, select { font-family: var(--font-body); font-size: 16px; padding: 12px 14px; border: 1px solid var(--border-default); border-radius: 8px; background: var(--ella-white); color: var(--ella-clay-900); }
  input:focus, select:focus { outline: 2px solid var(--ella-rose); outline-offset: 1px; border-color: var(--ella-rose); }
  input::placeholder { color: var(--ella-taupe-400); }
  .helper { font-size: 13px; color: var(--ella-taupe-500); }
</style>
</head>
<body>
  <div class="card-row" style="gap: 16px;">
    <div class="field">
      <label>Email address</label>
      <input type="email" placeholder="you@example.com" value="jessica@ellahealth.com">
      <div class="helper">We'll never share it.</div>
    </div>
    <div class="field">
      <label>Your age range</label>
      <select><option>45–54</option><option>55–64</option><option>65+</option></select>
    </div>
    <div class="field">
      <label>Symptoms (optional)</label>
      <input type="text" placeholder="Hot flashes, sleep, mood…">
    </div>
  </div>
</body></html>
