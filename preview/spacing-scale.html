<!doctype html>
<!-- @dsCard group="Brand" name="Spacing — Scale" subtitle="8pt grid · 4 → 128" viewport="700x220" -->
<html><head><meta charset="utf-8"><title>Spacing scale</title><link rel="stylesheet" href="_card.css"></head>
<body>
  <div style="display: flex; flex-direction: column; gap: 6px; font-family: var(--font-body); font-size: 13px; color: var(--fg-secondary);">
    <div style="display:flex; align-items:center; gap:12px;"><div style="width: 4px; height: 14px; background: var(--ella-rose);"></div><span class="swatch-label">space-1</span><span class="swatch-token">4px</span></div>
    <div style="display:flex; align-items:center; gap:12px;"><div style="width: 8px; height: 14px; background: var(--ella-rose);"></div><span class="swatch-label">space-2</span><span class="swatch-token">8px · grid unit</span></div>
    <div style="display:flex; align-items:center; gap:12px;"><div style="width: 16px; height: 14px; background: var(--ella-rose);"></div><span class="swatch-label">space-4</span><span class="swatch-token">16px</span></div>
    <div style="display:flex; align-items:center; gap:12px;"><div style="width: 24px; height: 14px; background: var(--ella-rose);"></div><span class="swatch-label">space-6</span><span class="swatch-token">24px · card padding</span></div>
    <div style="display:flex; align-items:center; gap:12px;"><div style="width: 32px; height: 14px; background: var(--ella-rose);"></div><span class="swatch-label">space-8</span><span class="swatch-token">32px</span></div>
    <div style="display:flex; align-items:center; gap:12px;"><div style="width: 48px; height: 14px; background: var(--ella-rose);"></div><span class="swatch-label">space-12</span><span class="swatch-token">48px</span></div>
    <div style="display:flex; align-items:center; gap:12px;"><div style="width: 80px; height: 14px; background: var(--ella-rose);"></div><span class="swatch-label">space-20</span><span class="swatch-token">80px · gutter</span></div>
    <div style="display:flex; align-items:center; gap:12px;"><div style="width: 128px; height: 14px; background: var(--ella-rose);"></div><span class="swatch-label">space-32</span><span class="swatch-token">128px · section</span></div>
  </div>
</body></html>
